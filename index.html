<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>놀러와요 빛누리마을 · 홈커밍</title>
  <style>
    :root{
      --bg:#F5F9F2; --primary:#4CAF88; --primary-600:#3C8F72; --accent:#FFD782;
      --ink:#2F3A2E; --muted:#6B7C6C; --card:#FFFFFF; --line:#E6EDD9;
      --shadow:0 8px 20px rgba(46,60,53,.12);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family: ui-rounded, "Pretendard", "Apple SD Gothic Neo", system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif}
    a,button,input,select,textarea{font:inherit}
    .container{max-width:720px;margin:0 auto;padding:20px 20px 64px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
    .title{font-weight:800;line-height:1.15;margin:0 0 8px}
    .subtitle{margin:0;color:var(--muted)}
    .btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:12px;padding:12px 16px;background:var(--primary);color:#fff;cursor:pointer}
    .btn:active{transform:translateY(1px)}
    .btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary)}
    .btn.ghost{background:transparent;color:var(--primary);border:1px dashed var(--primary)}
    .grid{display:grid;gap:16px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--accent);font-weight:700}
    .nav{position:sticky;bottom:0;left:0;right:0;background:rgba(245,249,242,.92);backdrop-filter: blur(6px);border-top:1px solid var(--line);z-index:20}
    .nav .bar{max-width:720px;margin:0 auto;display:flex;gap:8px;padding:10px}
    .nav .bar .btn{flex:1;justify-content:center}
    .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
    .hidden{display:none!important}
    .center{text-align:center}
    .hero{
      background:linear-gradient(180deg,#E9F6EE, #FDFBF5);
      border-radius:24px; padding:28px; border:1px solid var(--line); box-shadow:var(--shadow)
    }
    .hero h1{font-size:28px;margin:0 0 8px}
    .hero h1 .emoji{font-size:32px}
    .hero p{margin:8px 0}
    .stamp{
      display:inline-flex;align-items:center;gap:8px;
      background:#fff;border:2px dashed var(--primary-600);color:var(--primary-600);
      border-radius:14px;padding:8px 12px;font-weight:800
    }
    .list{display:grid;gap:12px}
    .msg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
    .msg .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:6px}
    .msg .text{white-space:pre-wrap}
    .avatar{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:#fff}
    .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s}
    .toast.show{opacity:1}
    .small{font-size:12px;color:var(--muted)}

    /* 항상 하단 고정 푸터 */
    .site-footer{
      position:fixed;left:0;right:0;bottom:6px;
      text-align:center;font-size:12px;color:#6B7C6C;
      background:rgba(245,249,242,.7);backdrop-filter: blur(4px);
      padding:4px 8px; z-index:5; pointer-events:none;
    }
  </style>

  <!-- Supabase SDK (module) -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
    window.supabase = createClient(
      "https://opswawlszrddaksvazdg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wc3dhd2xzenJkZGFrc3ZhemRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU2NTMwNDMsImV4cCI6MjA3MTIyOTA0M30.B0YBoG1coP0R3hIbnodBDW8lQQHAmfvUR4fpiQb3_gY"
    );
  </script>
</head>
<body>
<div class="container">

  <!-- PAGE 1: 초대장 -->
  <section id="page-invite" class="grid">
    <div class="hero">
      <div class="row" style="justify-content:space-between;align-items:center">
        <span class="stamp">🌿 HOMECOMING</span>
        <span class="badge">빛누리마을</span>
      </div>
      <h1 class="title" style="margin-top:10px">
        <span class="emoji">🍃</span> 놀러와요 <b>빛누리마을</b>
      </h1>
      <p class="subtitle">선배들과 함께 추억하고 노는 홈커밍 데이</p>
      <div class="grid" style="margin-top:16px">
        <div class="pill">📅 일시 <b>2025.09.07(일) 오후 54시</b></div>
        <div class="pill">👥 참여 대상 <b>빛누리마을 선배님들</b></div>
        <div class="pill">📍 장소 <b>안산동산교회 7층 에스더홀</b></div>
      </div>
      <div class="row" style="margin-top:18px">
        <button class="btn" onclick="go('#signup')">더 알아보기</button>
        <button class="btn secondary" onclick="go('#fortune')">오늘의 말씀 뽑기</button>
      </div>
    </div>
  </section>

  <!-- PAGE 2: 참가 신청 -->
  <section id="page-signup" class="grid hidden">
    <div class="card">
      <h2 class="title">참가 신청</h2>
      <p class="subtitle">이름/MBTI/기수를 남겨주세요 🌿</p>
      <div class="grid">
        <input id="in-name" class="input" placeholder="이름 (필수)" />
        <input id="in-mbti" class="input" placeholder="MBTI (선택, 예: INFP)" />
        <input id="in-cohort" class="input" placeholder="기수 (선택, 예: 30기)" />
        <button class="btn" onclick="submitSignup()">참가 신청하기</button>
      </div>
    </div>

    <div class="card">
      <h3 class="title" style="font-size:18px">신청자 미리보기(내 브라우저)</h3>
      <div id="attendee-preview" class="list"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h3 class="title" style="font-size:18px;margin:0">실시간 신청자 목록</h3>
        <div class="pill">총 <b id="attendee-count">0</b>명</div>
      </div>
      <div id="attendee-live" class="list" style="margin-top:12px"></div>
    </div>

    <div class="nav">
      <div class="bar">
        <button class="btn secondary" onclick="go('#invite')">초대장</button>
        <button class="btn" onclick="go('#fortune')">말씀 뽑기</button>
        <button class="btn secondary" onclick="go('#board')">메시지 보드</button>
      </div>
    </div>
  </section>

  <!-- PAGE 3: 랜덤 성경구절 뽑기 (미니게임) -->
  <section id="page-fortune" class="grid hidden">
    <div class="card center">
      <div style="font-size:44px">🍀</div>
      <h2 class="title">오늘의 말씀 뽑기</h2>
      <p class="subtitle">버튼을 눌러 랜덤 성경구절을 받아보세요</p>
      <div class="row" style="justify-content:center;margin-top:8px">
        <button class="btn" onclick="drawVerse()">말씀 뽑기</button>
        <button id="copyBtn" class="btn ghost hidden" onclick="copyVerse()">복사하기</button>
      </div>
      <div id="verse-card" class="card hidden" style="margin-top:14px;background:#fffefa">
        <div id="verse-text" style="font-size:18px;line-height:1.6;white-space:pre-wrap"></div>
        <div id="verse-ref" class="small" style="margin-top:8px"></div>
      </div>
      <div class="row" style="justify-content:center;margin-top:10px">
        <button class="btn secondary" onclick="go('#board')">마을 광장 가기</button>
      </div>
    </div>

    <div class="nav">
      <div class="bar">
        <button class="btn secondary" onclick="go('#invite')">초대장</button>
        <button class="btn" onclick="drawVerse()">다시 뽑기</button>
        <button class="btn secondary" onclick="go('#board')">메시지 보드</button>
      </div>
    </div>
  </section>

  <!-- PAGE 4: 마을 메시지 보드 -->
  <section id="page-board" class="grid hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 class="title" style="margin:0">마을 게시판</h2>
      </div>
      <p class="subtitle">한 줄 응원/추억을 남겨요. 홈커밍을 기대하는 마음 🍃</p>

      <div class="grid">
        <div class="row">
          <input id="msg-text" class="input" maxlength="120" placeholder="예) 선배님들 반가워요! 홈커밍에서 봬요 ✨ (최대 120자)" />
        </div>
        <div class="row">
          <select id="msg-avatar" class="input" style="max-width:220px">
            <option value="🐰">🐰 토끼</option>
            <option value="🐻">🐻 곰</option>
            <option value="🐶">🐶 강아지</option>
            <option value="🐱">🐱 고양이</option>
            <option value="🦊">🦊 여우</option>
            <option value="🐥">🐥 병아리</option>
          </select>
          <button class="btn" onclick="postMessage()">남기기</button>
        </div>
      </div>

      <div id="board-list" class="list" style="margin-top:12px"></div>

    </div>

    <div class="nav">
      <div class="bar">
        <button class="btn secondary" onclick="go('#invite')">초대장</button>
        <button class="btn secondary" onclick="go('#signup')">신청</button>
        <button class="btn" onclick="go('#fortune')">말씀 뽑기</button>
      </div>
    </div>
  </section>

</div>

<!-- 항상 하단 고정 푸터 -->
<div class="site-footer">만든이 : 35기 이서현 &gt;_&lt;</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
  /*** 로컬 상태 (내 브라우저 미리보기 용) ***/
  const KEYS = { attendee:'hc_attendee' };

  /*** 라우팅 ***/
  function go(hash){
    location.hash = hash;
    renderRoute();
  }
  function renderRoute(){
    const route = location.hash || '#invite';
    for(const id of ['invite','signup','fortune','board']){
      document.getElementById('page-'+id).classList.toggle('hidden', '#'+id !== route);
    }
    if(route==='#signup'){ renderAttendeePreview(); renderAttendeeLive(); }
    if(route==='#board'){ renderBoard(); }
  }
  window.addEventListener('hashchange', renderRoute);
  document.addEventListener('DOMContentLoaded', ()=>{ renderRoute(); });

  /*** 참가 신청: 로컬 + Supabase 저장 ***/
  async function submitSignup(){
    const name = document.getElementById('in-name').value.trim();
    const mbti = document.getElementById('in-mbti').value.trim().toUpperCase();
    const cohort = document.getElementById('in-cohort').value.trim();
    if(!name){ toast('이름은 필수입니다'); return; }

    // 1) 로컬 미리보기 저장
    const attendee = { name, mbti, cohort, ts: Date.now() };
    localStorage.setItem(KEYS.attendee, JSON.stringify(attendee));
    renderAttendeePreview();

    // 2) Supabase 공개 목록 저장
    const { error } = await supabase.from('attendees').insert([{
      name, mbti, cohort
    }]);
    if(error){ console.error(error); toast('신청 저장 실패(서버)'); return; }

    toast('신청 완료!');
    renderAttendeeLive(); // 목록 갱신
    go('#fortune');
  }

  function renderAttendeePreview(){
    const box = document.getElementById('attendee-preview');
    box.innerHTML = '';
    const raw = localStorage.getItem(KEYS.attendee);
    if(!raw){
      box.innerHTML = `<div class="small">아직 신청 정보가 없어요.</div>`;
      return;
    }
    const a = JSON.parse(raw);
    const el = document.createElement('div');
    el.className = 'msg';
    el.innerHTML = `
      <div class="meta">
        <span class="avatar">🌿</span>
        <b>${escapeHtml(a.name)}</b>
        <span class="pill">${a.mbti ? a.mbti : 'MBTI 미입력'}</span>
        <span class="pill">${a.cohort ? a.cohort : '기수 미입력'}</span>
      </div>
      <div class="text">홈커밍에 참여합니다! 🌿</div>
    `;
    box.appendChild(el);
  }

  /*** 실시간 신청자 목록 (Supabase) ***/
  async function fetchAttendees(){
    const { data, error } = await supabase
      .from('attendees')
      .select('*')
      .order('created_at', { ascending:false })
      .limit(200);
    if(error){ console.error(error); toast('신청자 불러오기 오류'); return []; }
    return data || [];
  }
  async function renderAttendeeLive(){
    const box = document.getElementById('attendee-live');
    const countEl = document.getElementById('attendee-count');
    box.innerHTML = '';
    const list = await fetchAttendees();
    countEl.textContent = list.length;

    if(list.length===0){
      box.innerHTML = `<div class="small">아직 신청자가 없어요. 첫 신청을 남겨주세요! 😊</div>`;
      return;
    }
    for(const a of list){
      const el = document.createElement('div');
      el.className = 'msg';
      const when = (a.created_at ? new Date(a.created_at).toLocaleString('ko-KR') : '');
      el.innerHTML = `
        <div class="meta">
          <span class="avatar">👥</span>
          <b>${escapeHtml(a.name||'익명')}</b>
          ${a.mbti?`<span class="pill">${escapeHtml(a.mbti)}</span>`:''}
          ${a.cohort?`<span class="pill">${escapeHtml(a.cohort)}</span>`:''}
          <span class="small">· ${when}</span>
        </div>
      `;
      box.appendChild(el);
    }
  }

  /*** 랜덤 성경구절 (한국어) ***/
  const VERSES = [
    {ref:'시편 23:1', text:'여호와는 나의 목자시니 내게 부족함이 없으리로다'},
    {ref:'시편 46:1', text:'하나님은 우리의 피난처시요 힘이시니 환난 중에 만날 큰 도움이시라'},
    {ref:'잠언 3:5', text:'너는 마음을 다하여 여호와를 신뢰하고 네 명철을 의지하지 말라'},
    {ref:'이사야 41:10', text:'두려워하지 말라 내가 너와 함께 함이라'},
    {ref:'예레미야 29:11', text:'너희를 향한 나의 생각은 평안이요 재앙이 아니니라'},
    {ref:'마태복음 11:28', text:'수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라'},
    {ref:'마태복음 28:20', text:'내가 세상 끝날까지 너희와 항상 함께 있으리라'},
    {ref:'요한복음 3:16', text:'하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라'},
    {ref:'로마서 8:28', text:'하나님을 사랑하는 자들에게는 모든 것이 합력하여 선을 이루느니라'},
    {ref:'빌립보서 4:13', text:'내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라'},
    {ref:'고린도전서 13:4-7', text:'사랑은 오래 참고 사랑은 온유하며 시기하지 아니하며 자랑하지 아니하며 교만하지 아니하며 무례히 행하지 아니하며 자기의 유익을 구하지 아니하며 성내지 아니하며 악한 것을 생각하지 아니하며 불의를 기뻐하지 아니하고 진리와 함께 기뻐하고 모든 것을 참으며 모든 것을 믿으며 모든 것을 바라며 모든 것을 견디느니라'},
    {ref:'시편 119:105', text:'주의 말씀은 내 발의 등불이요 내 길의 빛이니이다'},
    {ref:'로마서 15:13', text:'소망의 하나님이 모든 기쁨과 평강을 믿음 안에서 너희에게 충만하게 하시기를 원하노니 이는 성령의 능력으로 소망이 넘치게 하려 함이라'},
    {ref:'시편 37:4', text:'여호와를 기뻐하라 그가 네 마음의 소원을 이루어 주시리로다'},
    {ref:'이사야 40:31', text:'오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리가 날개치며 올라감 같을 것이요 달음에 곤비하지 아니하며 걸어가도 피곤하지 아니하리로다'},
    {ref:'시편 121:1-2', text:'내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올까 나의 도움은 천지를 지으신 여호와에게서 오리로다'},
    {ref:'요한복음 14:27', text:'평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라 내가 너희에게 주는 것은 세상이 주는 것과 같지 아니하니라 너희는 마음에 근심하지도 말고 두려워하지도 말라'},
    {ref:'시편 34:8', text:'여호와의 선하심을 맛보아 알지어다 그에게 피하는 자는 복이 있도다'},
    {ref:'빌립보서 4:6-7', text:'아무것도 염려하지 말고 오직 모든 일에 기도와 간구로 너희 구할 것을 감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라'},
    {ref:'시편 55:22', text:'네 짐을 여호와께 맡기라 그가 너를 붙드시고 의인 자가 결코 요동하지 않게 하지 아니하시리로다'},
    {ref:'이사야 43:2', text:'네가 물가운데로 지날 때에 내가 너와 함께 할 것이라 강을 건널 때에 물이 너를 침몰하지 못할 것이요 불가운데로 지날 때에 타지도 아니할 것이요 불꽃이 너를 사르지도 못하리니'}
  ];
  function drawVerse(){
    const idx = Math.floor(Math.random()*VERSES.length);
    const v = VERSES[idx];
    document.getElementById('verse-text').textContent = v.text;
    document.getElementById('verse-ref').textContent = '— ' + v.ref;
    document.getElementById('verse-card').classList.remove('hidden');
    document.getElementById('copyBtn').classList.remove('hidden');
    toast('말씀이 도착했어요 🍃');
  }
  function copyVerse(){
    const text = document.getElementById('verse-text').textContent.trim();
    const ref = document.getElementById('verse-ref').textContent.trim();
    navigator.clipboard.writeText(`${text}\n${ref}`).then(()=>toast('클립보드에 복사됨'));
  }

  /*** 게시판 (Supabase) ***/
  async function getMessages() {
    const { data, error } = await supabase
      .from('messages')
      .select('*')
      .order('ts', { ascending: false })
      .limit(100);
    if (error) { console.error(error); toast('불러오기 오류'); return []; }
    return data || [];
  }
  async function postMessage() {
    const textEl = document.getElementById('msg-text');
    const avatar = document.getElementById('msg-avatar').value;
    const text = textEl.value.trim();
    if (!text) { toast('메시지를 입력해 주세요'); return; }
    if (text.length > 120) { toast('120자 이내로 작성해 주세요'); return; }

    const raw = localStorage.getItem(KEYS.attendee);
    const a = raw ? JSON.parse(raw) : { name:'익명', mbti:'', cohort:'' };

    const { error } = await supabase.from('messages').insert([{
      name: a.name || '익명',
      mbti: a.mbti || '',
      cohort: a.cohort || '',
      avatar, text
    }]);
    if (error) { console.error(error); toast('등록 실패'); return; }

    textEl.value = '';
    renderBoard();
    toast('게시되었습니다 🌿');
  }
  async function renderBoard() {
    const box = document.getElementById('board-list');
    const arr = await getMessages();

    box.innerHTML = '';
    if (arr.length===0) {
      box.innerHTML = `<div class="small">아직 메시지가 없어요. 첫 글을 남겨주세요! 😊</div>`;
      return;
    }
    for (const m of arr) {
      const el = document.createElement('div');
      el.className = 'msg';
      const when = m.ts ? new Date(m.ts).toLocaleString('ko-KR') : '';
      el.innerHTML = `
        <div class="meta">
          <span class="avatar">${m.avatar||'🌿'}</span>
          <b>${escapeHtml(m.name||'익명')}</b>
          ${m.mbti?`<span class="pill">${escapeHtml(m.mbti)}</span>`:''}
          ${m.cohort?`<span class="pill">${escapeHtml(m.cohort)}</span>`:''}
          <span class="small">· ${when}</span>
        </div>
        <div class="text">${escapeHtml(m.text)}</div>
      `;
      box.appendChild(el);
    }
  }

  /*** 유틸 ***/
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1600);
  }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
</script>
</body>
</html>
